[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "commonground-kernel"
version = "3.1.0"
description = "CommonGround service, CLI, and integration implementation"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [
    { name = "Intelligent Internet" },
]
keywords = ["commonground", "agent", "cli", "ledger", "workflow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "python-dotenv>=1.0",
    "httpx>=0.28",
    "uuid6>=2024.7.10",
]

[project.optional-dependencies]
server = [
    "boto3>=1.42.6",
    "cardbox",
    "cryptography>=46",
    "fastapi>=0.115",
    "instructor",
    "litellm",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "requests",
    "tenacity==9.1.2",
    "uvicorn>=0.30",
]
nanobot = [
    "nanobot-ai",
]

[project.scripts]
cg = "CommonGround.cli:main"

[project.urls]
Homepage = "https://github.com/Intelligent-Internet/CommonGround"
Repository = "https://github.com/Intelligent-Internet/CommonGround"
Issues = "https://github.com/Intelligent-Internet/CommonGround/issues"

[tool.uv]
package = true

[tool.uv.sources]
cardbox = { path = "CG-Cardbox", editable = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["CommonGround*", "Integrations*"]
